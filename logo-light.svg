<svg width="160" height="200" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kyrusFlameGradient" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="55%" stop-color="#2FA6FF" />
      <stop offset="100%" stop-color="#7FE0FF" />
    </linearGradient>
    <linearGradient id="kyrusMetalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D7DDE4" />
      <stop offset="100%" stop-color="#AEB6C2" />
    </linearGradient>
    <filter id="kyrusFlameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flamme bleue officielle (identique sur toutes les variantes) -->
  <g filter="url(#kyrusFlameGlow)">
    <path
      d="M80 8C58 34 42 54 40 80c-3 24 10 43 34 46-10-13-10-27-2-38 3 16 14 24 27 30 13-19 10-35-3-51 11 5 19 14 22 27 13-16 8-38-11-56 5 11 3 22-5 30 0-27-11-51-22-60z"
      fill="url(#kyrusFlameGradient)"
    />
  </g>

  <!-- Monogramme KY — variante Light, pour usage sur fond clair -->
  <g fill="url(#kyrusMetalLight)" stroke="#8A93A0" stroke-width="1" stroke-linejoin="round">
    <polygon points="46,64 62,64 62,150 46,150" />
    <polygon points="62,104 96,64 116,64 78,110" />
    <polygon points="62,108 116,150 96,150 62,118" />
    <polygon points="86,64 104,64 122,100 108,100" />
    <polygon points="122,64 140,64 116,110 104,100" />
    <polygon points="108,100 122,100 122,150 108,150" />
  </g>
</svg>
